apiVersion: v1
kind: ConfigMap
metadata:
  name: nexusflow-config
data:
  NODE_ENV: "production"
  API_GATEWAY_PORT: "3000"
  AUTH_SERVICE_PORT: "3001"
  USER_SERVICE_PORT: "3002"
  WORKFLOW_SERVICE_PORT: "3003"
  AI_SERVICE_PORT: "3004"
  NOTIFICATION_SERVICE_PORT: "3005"
  ANALYTICS_SERVICE_PORT: "3006"
  LOG_LEVEL: "info"
  LOG_FORMAT: "json"
---
apiVersion: v1
kind: Secret
metadata:
  name: nexusflow-secrets
type: Opaque
stringData:
  JWT_SECRET: "change-me-in-production"
  JWT_REFRESH_SECRET: "change-me-in-production-refresh"
  DATABASE_URL: "postgresql://nexusflow:secret@postgres:5432/nexusflow"
  REDIS_URL: "redis://redis:6379"
  OPENAI_API_KEY: "your-openai-key"
